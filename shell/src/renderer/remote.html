<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A remote view of an instance (the same screens as the desktop window, in a browser): it talks to the
         instance only through the socket next to this page. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <!-- A phone shows the page at its own width (below 760 px: the phone layout, src/phone.ts), edge to edge; the screens
         keep clear of a notch and the home bar with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark" />
    <!-- Sets data-theme on <html> from the kept choice (else the OS) before the stylesheet paints, so a dark theme has no
         white first frame. A classic script file from 'self', which the CSP above allows (an inline one it does not); it must
         stay before the page's stylesheet and module script. theme.ts then takes over. -->
    <script vite-ignore src="./theme-boot.js" data-key="yawble.remoteTheme"></script>
    <title>Yawble</title>
  </head>
  <!-- -webkit-text-size-adjust: iOS Safari enlarges the text in landscape unless told not to (inherited, so the
       whole page). Here, not in styles.css: the build's CSS minifier targets desktop Safari, which has no text-size-adjust,
       and drops the prefix; and not on <html>, whose style theme.ts rewrites (color-scheme). -->
  <body style="-webkit-text-size-adjust: 100%; text-size-adjust: 100%">
    <div id="app"></div>
    <!-- A read-only viewer (a workgroup Visitor) gets a "Read-only (Visitor)" chip added here by remoteAccess.ts. -->
    <script type="module" src="./src/remote.ts"></script>
  </body>
</html>
