<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <!-- Until theme.ts (the first thing the page's script runs) sets data-theme on <html>, the page's own background follows
         the OS, so a dark OS never sees a white page first. The inline-script way is closed by the CSP above. -->
    <meta name="color-scheme" content="light dark" />
    <title>Yawble</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
