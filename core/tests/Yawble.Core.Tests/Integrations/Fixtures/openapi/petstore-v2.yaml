swagger: "2.0"
info:
  title: Petstore Two
  version: 1.0.0
host: api.example.com
basePath: /v2
schemes:
  - https
securityDefinitions:
  basic_auth:
    type: basic
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          type: integer
      responses:
        "200":
          description: ok
    post:
      operationId: addPet
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
      responses:
        "200":
          description: ok
